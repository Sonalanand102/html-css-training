<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forms</title>
    </head>

    <body>
        <form>


            <label for="username"><span style="color: red;">* </span>Name:</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email:</label>

            <input
                type="email"
                id="email"
                name="email"
                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                placeholder="Enter your email"
            >

            <input type="password" placeholder="Enter password" required minlength="8" maxlength="20">

            <input type="number" placeholder="Enter age" min="18" max="100" minlength="2" maxlength="3">

            <input type="date" min="1900-01-01" max="2023-12-31">

            <input type="tel" placeholder="Enter phone number" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" title="Phone number format: 123-456-7890">

            <!-- TYPES OF INPUT FIELDS -->

            <input type="file">

            <input type="checkbox">

            <input type="radio"> -->

            <p>Select your gender:</p>

            <label for="male">Male</label>
            <input type="radio" id="male" name="gender" value="male">

            <label for="female">Female</label>
            <input type="radio" id="female" name="gender" value="female">

            <p>Select your skills:</p>

            <label for="html">HTML</label>
            <input type="checkbox" id="html" name="skills" value="html">

            <label for="css">CSS</label>
            <input type="checkbox" id="css" name="skills" value="css">

            <label for="javascript">JavaScript</label>
            <input type="checkbox" id="javascript" name="skills" value="javascript">

            <p>Select your country:</p>

            <select name="country" id="country">
                <option value="" disabled selected>Select a country</option>
                <option value="usa">USA</option>
                <option value="canada">Canada</option>
                <option value="uk">UK</option>
                <option value="other" >Other</option>

            </select>

            <label for="message">Message:</label>

            <textarea
                id="message"
                name="message"
                rows="4"
                cols="50"
                placeholder="Enter your message"
            ></textarea>

            <button type="submit">Submit</button>

        </form>

    </body>
</html>
